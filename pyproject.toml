[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "epos-next"
version = "0.0.1"
description = "EPOS NEXT — authoritative Python narrative RPG engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.8,<7",
]
server = [
  "uvicorn>=0.34,<1",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["epos"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[tool.hatch.build.targets.wheel]
packages = ["src/epos"]

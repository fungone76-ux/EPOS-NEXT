name: quality-gates

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Pytest
        run: pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy strict
        run: mypy --strict src

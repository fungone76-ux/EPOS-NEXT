name: quality-gates

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Pytest
        run: pytest -q
      - name: Ruff diagnostic
        run: |
          ruff check . --fix
          git diff -- tests/application/test_intimacy_consent.py
          git diff --exit-code
      - name: Mypy strict
        run: mypy --strict src

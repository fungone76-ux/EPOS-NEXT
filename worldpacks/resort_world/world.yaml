world_truth:
  facts:
    fact_all_adults:
      statement: Tutti i personaggi coinvolti in dinamiche romantiche o sensuali sono adulti.
      visibility: public
      does_not_imply:
      - Il consenso è automatico.
    fact_no_conspiracy:
      statement: Le difficoltà del resort non nascondono un complotto.
      visibility: contextual
      does_not_imply:
      - Esistono sabotaggi nascosti.
    fact_victoria_knows_purchase:
      statement: Solo Victoria conosce inizialmente il possibile interesse per l'acquisto.
      visibility: secret
      does_not_imply:
      - Le altre lo sanno già.
    premise: Un miliardario adulto trascorre sette notti all'Azure Crown Resort sull'isola di Calista, tra servizio VIP, relazioni
      e una possibile acquisizione.
narrative_config:

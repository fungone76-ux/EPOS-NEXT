  location_descriptions:
    loc_suite: Suite mediterranea moderna con bagno di lusso e terrazza sul mare.
    loc_lobby: Grande lobby di marmo e vetro con vista sul Mediterraneo.
    loc_restaurant: Ristorante elegante sul mare con terrazza panoramica.
    loc_pool: Piscina panoramica con deck privato.
    loc_spa: Area benessere con sauna bagno turco e sale massaggi.
    loc_private_beach: Spiaggia riservata con lettini eleganti.
    loc_wild_beach: Cala rocciosa isolata e naturale.
    loc_lounge: Cocktail lounge con terrazza panoramica.
    loc_victoria_office: Ufficio executive elegante con vista sul resort.

    e una possibile acquisizione.
  opening_narration: L'elicottero privato atterra all'Azure Crown. Victoria Hale accoglie il protagonista nella lobby e gli
    presenta Stella, Maria e Luna.
  interactive_creation: true
  open_end: true
  riserva_dice: 0
  player_resources:
